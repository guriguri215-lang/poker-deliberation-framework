  numeric_exactness_modes:
  - exact-under-model
  legacy_exactness_projection:
    exact: exact
    exact-under-model: exact
    floating-verified: exact
    approximate: approximate
    unavailable: unavailable
  assumptions:
  - Action amounts use the caller-declared canonical decimal chip unit.
  - Only generic_nlhe_cash_no_rake_v1 version 1.0.0 and supported site none apply.
  - No winner assignment, payout split, rake, or hand-strength evaluation is made.
  preconditions:
  - explicit supported profile and version
  - explicit zero rake
  - complete legal betting rounds
  - every monetary value is an exact bounded integer number of chip units
  limits:
    players: 10
    actions: 512
    ledger_units: 9223372036854775807
    supported_profiles: 1
    external_execution: not performed
  units:
    all ledger, stack, return, and pot values: input.rule_profile.chip_unit
  failure_modes:
  - strict input schema rejection (including extra or missing fields)
  - documented precondition violation
  - hard resource limit violation
  - strict output schema or invariant failure
  - unsupported profile, version, site, game, format, rake, straddle, or ante shape
  - illegal or incomplete betting sequence
  - ambiguous uncalled return
  - non-integral or overflowing chip-unit conversion
  - conservation or independent-oracle mismatch
  verification_checks:
  - integer stack and pot conservation
  - gross contribution equals final pot plus uncalled returns
  - pot layers sum to final pot
  - independent Fraction/integer oracle agreement
  tolerance: null
  model_qualifier: generic_nlhe_cash_no_rake_v1 version 1.0.0
  version: 1.0.0
  contract_version: 2.0.0
  command: poker-deliberate calculate hand_pot_ledger --analysis-scope retrospective --input INPUT.json
- name: sensitivity
  purpose: Bounds and influence ranking over a supplied scenario grid.
  supported_games:
  - generic
  input_schema:
    $defs:
      SensitivityScenario:
        additionalProperties: false
        properties:
          name:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            title: Name
          parameters:
            additionalProperties: true
            title: Parameters
            type: object
          value:
            title: Value
            type: number
        required:
        - parameters
        - value
        title: SensitivityScenario
        type: object
    additionalProperties: false
    properties:
      scenarios:
        items:
          $ref: '#/$defs/SensitivityScenario'
        minItems: 1
        title: Scenarios
        type: array
      decision_threshold:
        default: 0.0
        title: Decision Threshold
        type: number
    required:
    - scenarios
    title: SensitivityInput
    type: object
  output_schema:
    additionalProperties: false
    properties:
      lower_bound:
        title: Lower Bound
        type: number
      upper_bound:
        title: Upper Bound
        type: number
      decision_threshold:
        title: Decision Threshold
        type: number
      scenarios_at_or_above_threshold:
        items:
          additionalProperties: true
          type: object
        title: Scenarios At Or Above Threshold
        type: array
      influence_ranking:
        items:
          additionalProperties: true
          type: object
        title: Influence Ranking
        type: array
      scenario_count:
        minimum: 1
        title: Scenario Count
        type: integer
      warning:
        title: Warning
        type: string
    required:
    - lower_bound
    - upper_bound
    - decision_threshold
    - scenarios_at_or_above_threshold
    - influence_ranking
    - scenario_count
    - warning
    title: SensitivityOutput
    type: object
  numeric_exactness_modes:
  - floating-verified
  legacy_exactness_projection:
    exact: exact
    exact-under-model: exact
    floating-verified: exact
    approximate: approximate
    unavailable: unavailable
  assumptions:
  - Bounds and associations apply only to the supplied grid.
  preconditions:
  - at least one finite-valued scenario
  - parameters are JSON-serializable
  limits:
    payload_bytes: 1000000
  units:
    values/bounds/threshold: caller value unit
    impact: same unit
  failure_modes:
  - strict input schema rejection (including extra or missing fields)
  - documented precondition violation
  - hard resource limit violation
  - strict output schema or invariant failure
  verification_checks:
  - ordered bounds
  - scenario count
  - descending influence ranking
  tolerance:
    fields:
    - setting means
    - impact
    kind: ulp
    absolute: null
    relative: null
    ulps: 64
    formula: Mean and spread bound scales with observations per setting.
    unit: output field unit
    rationale: Grid values are finite binary64 and aggregation depth is bounded by payload size.
  model_qualifier: caller-supplied finite scenario grid
  version: 1.0.0
  contract_version: 2.0.0
  command: poker-deliberate calculate sensitivity --analysis-scope retrospective --input INPUT.json
