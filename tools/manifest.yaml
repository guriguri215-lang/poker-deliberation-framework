    - best_responder_value
    - player0_value
    - payoff_convention
    - pure_policy
    - evaluated_policies
    - policy_node_work_upper_bound
    - information_set_constraint_enforced
    - opponent_strategy_fixed
    - equilibrium_claim
    title: BestResponseOutput
    type: object
  numeric_exactness_modes:
  - floating-verified
  legacy_exactness_projection:
    exact: exact
    exact-under-model: exact
    floating-verified: exact
    approximate: approximate
    unavailable: unavailable
  assumptions:
  - Perfect recall; finite acyclic tree; opponent strategy fixed at every information set.
  preconditions:
  - two-player zero-sum payoff convention
  - consistent information-set actions
  limits:
    pure_policies: 1000000
    nodes: 10000
    policy_node_work: 5000000
    depth: 256
  units:
