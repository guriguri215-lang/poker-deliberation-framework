      title: Contract Version
      type: string
    assumptions:
      items:
        type: string
      title: Assumptions
      type: array
    version:
      default: 1.0.0
      title: Version
      type: string
    model_qualifier:
      anyOf:
      - type: string
      - type: 'null'
      default: null
      title: Model Qualifier
    method:
      anyOf:
      - type: string
      - type: 'null'
      default: null
      title: Method
    stochastic:
      anyOf:
      - type: boolean
      - type: 'null'
      default: null
      title: Stochastic
    seed:
      anyOf:
      - type: integer
      - type: 'null'
      default: null
      title: Seed
    samples:
      anyOf:
      - minimum: 0
        type: integer
      - type: 'null'
      default: null
      title: Samples
    iterations:
      anyOf:
      - minimum: 0
        type: integer
      - type: 'null'
      default: null
      title: Iterations
    confidence_interval:
      anyOf:
      - maxItems: 2
        minItems: 2
