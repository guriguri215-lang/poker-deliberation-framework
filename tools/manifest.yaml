        - information_set
        - actions
        title: PlayerGameNode
        type: object
      TerminalGameNode:
        additionalProperties: false
        properties:
          type:
            const: terminal
            title: Type
            type: string
          payoff:
            title: Payoff
            type: number
        required:
        - type
        - payoff
        title: TerminalGameNode
        type: object
    additionalProperties: false
    properties:
      game:
        $ref: '#/$defs/BestResponseGame'
      fixed_strategy:
        additionalProperties:
          additionalProperties:
            maximum: 1
            minimum: 0
            type: number
          type: object
        title: Fixed Strategy
        type: object
      best_responder:
        default: 0
        enum:
        - 0
        - 1
        title: Best Responder
        type: integer
      max_pure_policies:
        default: 1000000
        maximum: 1000000
        minimum: 1
        title: Max Pure Policies
        type: integer
    required:
    - game
    - fixed_strategy
    title: BestResponseInput
    type: object
  output_schema:
    additionalProperties: false
    properties:
      best_responder:
        enum:
        - 0
        - 1
        title: Best Responder
        type: integer
      value:
        title: Value
        type: number
      best_responder_value:
        title: Best Responder Value
        type: number
      player0_value:
        title: Player0 Value
        type: number
      payoff_convention:
        title: Payoff Convention
        type: string
      pure_policy:
        additionalProperties:
          type: string
        title: Pure Policy
        type: object
      evaluated_policies:
        minimum: 1
        title: Evaluated Policies
        type: integer
      policy_node_work_upper_bound:
        minimum: 1
        title: Policy Node Work Upper Bound
        type: integer
      information_set_constraint_enforced:
        const: true
        title: Information Set Constraint Enforced
        type: boolean
      opponent_strategy_fixed:
        const: true
        title: Opponent Strategy Fixed
        type: boolean
      equilibrium_claim:
        const: false
        title: Equilibrium Claim
        type: boolean
    required:
