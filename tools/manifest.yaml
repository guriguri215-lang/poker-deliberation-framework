- name: fixed_strategy_best_response
  purpose: Best response to a fully fixed opponent strategy in a bounded finite game.
  supported_games:
  - finite_extensive_form
  input_schema:
    $defs:
      BestResponseGame:
        additionalProperties: false
        properties:
          root:
            default: root
            title: Root
            type: string
          nodes:
            additionalProperties:
              discriminator:
                mapping:
                  chance: '#/$defs/ChanceGameNode'
                  player: '#/$defs/PlayerGameNode'
                  terminal: '#/$defs/TerminalGameNode'
                propertyName: type
              oneOf:
              - $ref: '#/$defs/TerminalGameNode'
              - $ref: '#/$defs/ChanceGameNode'
              - $ref: '#/$defs/PlayerGameNode'
            maxProperties: 10000
            minProperties: 1
