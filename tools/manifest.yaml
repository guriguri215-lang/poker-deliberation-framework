# Generated by scripts/generate_tool_contracts.py; do not edit manually.
schema_version: 2
canonical_source: poker_deliberation.tools.contracts.tool_contracts
policy:
  default_timeout_seconds: 30
  default_input_limit_bytes: 1000000
  default_output_limit_bytes: 1000000
  default_run_limit_bytes: 10000000
  external_execution_requires_approval: true
  legacy_exactness_field: compatibility projection; use numeric_exactness for v2
tool_result_schema:
  $defs:
    Exactness:
      description: 'Legacy three-value compatibility projection.


        New results also expose ``numeric_exactness``.  This field remains stable so

        version-1 JSON consumers can migrate without an enum-breaking change.'
      enum:
      - exact
      - approximate
      - unavailable
      title: Exactness
      type: string
    NumericalErrorMetadata:
      additionalProperties: false
      properties:
        metric:
          minLength: 1
          title: Metric
          type: string
        value:
          minimum: 0
          title: Value
          type: number
        bound:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Bound
        unit:
          title: Unit
          type: string
      required:
      - metric
      - value
      - unit
      title: NumericalErrorMetadata
      type: object
    NumericalExactness:
      enum:
      - exact
      - exact-under-model
      - floating-verified
      - approximate
      - unavailable
      title: NumericalExactness
      type: string
    TolerancePolicy:
      additionalProperties: false
      description: Algorithm/field-specific tolerance; never a repository-wide epsilon.
      properties:
        fields:
          items:
            type: string
          minItems: 1
          title: Fields
          type: array
        kind:
          enum:
          - absolute
          - relative
          - absolute-or-relative
          - ulp
          - caller-supplied
          title: Kind
          type: string
        absolute:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Absolute
        relative:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Relative
        ulps:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Ulps
        formula:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Formula
        unit:
          title: Unit
          type: string
        rationale:
          title: Rationale
          type: string
      required:
      - fields
      - kind
      - unit
      - rationale
      title: TolerancePolicy
      type: object
    ToolStatus:
      enum:
      - success
      - failed
      - unavailable
      title: ToolStatus
      type: string
    VerificationMetadata:
      additionalProperties: false
      properties:
        method:
          minLength: 1
          title: Method
          type: string
        checks:
          items:
            type: string
          minItems: 1
          title: Checks
          type: array
        tolerance:
          $ref: '#/$defs/TolerancePolicy'
        passed:
          title: Passed
          type: boolean
      required:
      - method
      - checks
      - tolerance
      - passed
      title: VerificationMetadata
      type: object
  additionalProperties: false
  properties:
    result_id:
      title: Result Id
      type: string
    tool_name:
      title: Tool Name
      type: string
    input:
      additionalProperties: true
      title: Input
      type: object
    output:
      additionalProperties: true
      title: Output
      type: object
    status:
      $ref: '#/$defs/ToolStatus'
    exactness:
      $ref: '#/$defs/Exactness'
    numeric_exactness:
      $ref: '#/$defs/NumericalExactness'
    contract_version:
      default: 1.0.0
      title: Contract Version
      type: string
    assumptions:
      items:
        type: string
      title: Assumptions
      type: array
    version:
      default: 1.0.0
      title: Version
      type: string
    model_qualifier:
      anyOf:
      - type: string
      - type: 'null'
      default: null
      title: Model Qualifier
    method:
      anyOf:
      - type: string
      - type: 'null'
      default: null
      title: Method
    stochastic:
      anyOf:
      - type: boolean
      - type: 'null'
      default: null
      title: Stochastic
    seed:
      anyOf:
      - type: integer
      - type: 'null'
      default: null
      title: Seed
    samples:
      anyOf:
      - minimum: 0
        type: integer
      - type: 'null'
      default: null
      title: Samples
    iterations:
      anyOf:
      - minimum: 0
        type: integer
      - type: 'null'
      default: null
      title: Iterations
    confidence_interval:
      anyOf:
      - maxItems: 2
        minItems: 2
        prefixItems:
        - type: number
        - type: number
        type: array
      - type: 'null'
      default: null
      title: Confidence Interval
    confidence_level:
      anyOf:
      - exclusiveMaximum: 1
        exclusiveMinimum: 0
        type: number
      - type: 'null'
      default: null
      title: Confidence Level
    error_metadata:
      anyOf:
      - $ref: '#/$defs/NumericalErrorMetadata'
      - type: 'null'
      default: null
    stopping_condition:
      anyOf:
      - type: string
      - type: 'null'
      default: null
      title: Stopping Condition
    verification:
      anyOf:
      - $ref: '#/$defs/VerificationMetadata'
      - type: 'null'
      default: null
    duration_seconds:
      default: 0
      minimum: 0
      title: Duration Seconds
      type: number
    warnings:
      items:
        type: string
      title: Warnings
      type: array
    error:
      anyOf:
      - type: string
      - type: 'null'
      default: null
      title: Error
    reproduce_command:
      anyOf:
      - type: string
      - type: 'null'
      default: null
      title: Reproduce Command
    created_at:
      format: date-time
      title: Created At
      type: string
  required:
  - tool_name
  - input
  - status
  - exactness
  - numeric_exactness
  title: ToolResult
  type: object
