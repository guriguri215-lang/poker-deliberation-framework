          child:
            title: Child
            type: string
        required:
        - probability
        - child
        title: ChanceAction
        type: object
      ChanceGameNode:
        additionalProperties: false
        properties:
          type:
            const: chance
            title: Type
            type: string
          actions:
            additionalProperties:
              $ref: '#/$defs/ChanceAction'
            minProperties: 1
            title: Actions
            type: object
        required:
        - type
        - actions
        title: ChanceGameNode
        type: object
      PlayerGameNode:
        additionalProperties: false
        properties:
          type:
            const: player
            title: Type
            type: string
