# Generated by scripts/generate_tool_contracts.py; do not edit manually.
schema_version: 2
canonical_source: poker_deliberation.tools.contracts.tool_contracts
policy:
  default_timeout_seconds: 30
  default_input_limit_bytes: 1000000
  default_output_limit_bytes: 1000000
  default_run_limit_bytes: 10000000
  external_execution_requires_approval: true
  legacy_exactness_field: compatibility projection; use numeric_exactness for v2
tool_result_schema:
  $defs:
    Exactness:
      description: 'Legacy three-value compatibility projection.


        New results also expose ``numeric_exactness``.  This field remains stable so

        version-1 JSON consumers can migrate without an enum-breaking change.'
      enum:
      - exact
      - approximate
      - unavailable
      title: Exactness
      type: string
    NumericalErrorMetadata:
      additionalProperties: false
      properties:
        metric:
          minLength: 1
          title: Metric
          type: string
        value:
          minimum: 0
          title: Value
          type: number
        bound:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Bound
        unit:
          title: Unit
          type: string
      required:
      - metric
      - value
      - unit
      title: NumericalErrorMetadata
      type: object
    NumericalExactness:
      enum:
      - exact
      - exact-under-model
      - floating-verified
      - approximate
      - unavailable
      title: NumericalExactness
      type: string
    TolerancePolicy:
      additionalProperties: false
      description: 'Algorithm/field-specific comparison rule; never a repository-wide epsilon.


        ``absolute`` is expressed in the named field unit, ``relative`` scales by

        ``max(abs(actual), abs(expected))``, and ``ulps`` scales by the binary64

        magnitude.  A caller-supplied policy records its resolved per-result bound

        in ``absolute``.  No kind inherits ``math.isclose``''s default relative

        tolerance.'
      properties:
        fields:
          items:
            type: string
          minItems: 1
          title: Fields
          type: array
        kind:
          enum:
          - absolute
          - relative
          - absolute-or-relative
          - ulp
          - caller-supplied
          title: Kind
          type: string
        absolute:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Absolute
        relative:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Relative
        ulps:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Ulps
        formula:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Formula
        unit:
          title: Unit
          type: string
        rationale:
          title: Rationale
          type: string
      required:
      - fields
      - kind
      - unit
      - rationale
      title: TolerancePolicy
      type: object
    ToolStatus:
      enum:
      - success
      - failed
      - unavailable
      title: ToolStatus
      type: string
    VerificationMetadata:
      additionalProperties: false
      properties:
        method:
          minLength: 1
          title: Method
          type: string
        checks:
          items:
            type: string
          minItems: 1
          title: Checks
          type: array
        observations:
          items:
            type: string
          title: Observations
          type: array
        tolerance:
          $ref: '#/$defs/TolerancePolicy'
        passed:
          title: Passed
          type: boolean
      required:
      - method
      - checks
      - tolerance
      - passed
      title: VerificationMetadata
      type: object
  additionalProperties: false
  properties:
    result_id:
      title: Result Id
      type: string
    tool_name:
      title: Tool Name
      type: string
    input:
      additionalProperties: true
      title: Input
      type: object
    output:
      additionalProperties: true
      title: Output
      type: object
    status:
      $ref: '#/$defs/ToolStatus'
    exactness:
